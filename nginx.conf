server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular ist eine SPA: jede unbekannte Route gehoert an den Router,
    # nicht an einen 404 von nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gehashte Build-Artefakte duerfen lange im Cache liegen.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html nie cachen, sonst sieht der Browser nach einem Deploy
    # noch die alten Dateinamen.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
